<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnCam Coach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            border-radius: 25px; 
            padding: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #667eea; 
            text-align: center; 
            margin-bottom: 15px; 
            font-size: 2em; 
        }
        .subtitle { 
            text-align: center; 
            margin-bottom: 35px; 
            line-height: 1.8;
            color: #555;
        }
        .btn { 
            width: 100%; 
            padding: 18px; 
            margin: 12px 0; 
            border: none; 
            border-radius: 15px; 
            font-size: 1.1em; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: inherit;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
        }
        .btn-secondary { 
            background: #f0f0f0; 
            color: #333; 
        }
        .page { display: none; }
        .page.active { display: block; }
        #video { 
            width: 100%; 
            height: 300px; 
            background: #000; 
            border-radius: 15px; 
            margin: 20px 0;
        }
        .version { 
            text-align: center; 
            color: #999; 
            font-size: 0.8em; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- עמוד בית -->
        <div id="home" class="page active">
            <h1>🎤 OnCam Coach</h1>
            <div class="subtitle">
                <div>יש לך בקרוב ראיון, אודיש'ן, הרצאה, פיץ' ?</div>
                <div>אני כאן בשבילך.</div>
            </div>
            <p class="version">גרסה 3.0 • מושלם!</p>
            
            <button class="btn btn-primary" onclick="goToCamera()">
                🚀 התחל אימון חדש
            </button>
            <button class="btn btn-secondary" onclick="goToHistory()">
                📊 היסטוריית אימונים
            </button>
        </div>

        <!-- עמוד מצלמה -->
        <div id="camera" class="page">
            <h1>🎬 הקלטה</h1>
            
            <div style="position: relative;">
                <video id="video" autoplay muted></video>
                <div id="timer" style="position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); color: white; padding: 10px 15px; border-radius: 10px; font-size: 1.2em; font-weight: bold;">00:00</div>
                <div id="word-count" style="position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); color: white; padding: 10px 15px; border-radius: 10px; font-size: 1.2em; font-weight: bold;">0 מילים</div>
                <div id="eye-indicator" style="position: absolute; bottom: 15px; left: 15px; background: rgba(76, 175, 80, 0.9); color: white; padding: 8px 12px; border-radius: 8px; font-size: 1em; font-weight: bold; display: none;">👁️ טוב</div>
            </div>
            
            <div id="transcript-box" style="background: #f8f9fa; border-radius: 15px; padding: 20px; margin: 20px 0; min-height: 80px; border: 2px solid #e9ecef;">
                <div style="font-weight: bold; color: #667eea; margin-bottom: 10px;">תמלול:</div>
                <div id="transcript-text" style="color: #999;">התמלול יופיע כאן...</div>
            </div>
            
            <button id="start-btn" class="btn btn-primary" onclick="startRecording()">
                ⏺️ התחל הקלטה
            </button>
            <button id="stop-btn" class="btn btn-secondary" onclick="stopRecording()" style="display: none;">
                ⏹️ עצור הקלטה
            </button>
            <button class="btn btn-secondary" onclick="goHome()">
                🏠 חזור לבית
            </button>
        </div>

        <!-- עמוד היסטוריה -->
        <div id="history" class="page">
            <h1>📊 היסטוריה</h1>
            <div id="history-list">
                <!-- התוכן ימולא דינמית -->
            </div>
            <button class="btn btn-secondary" onclick="goHome()">
                🏠 חזור לבית
            </button>
        </div>

        <!-- עמוד תוצאות -->
        <div id="results" class="page">
            <h1>🏆 תוצאות</h1>
            
            <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 20px; text-align: center; margin: 20px 0;">
                <div style="font-size: 1.2em; margin-bottom: 10px;">ציון כללי</div>
                <div id="final-score" style="font-size: 3.5em; font-weight: 800; margin: 10px 0;">0</div>
                <div style="margin-top: 5px;">מתוך 100</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0;">
                <div style="background: #f8f9fa; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #e9ecef;">
                    <div style="color: #666; font-size: 0.9em;">מילים לדקה</div>
                    <div id="result-wpm" style="font-size: 2em; font-weight: 700; color: #667eea; margin: 8px 0;">0</div>
                </div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #e9ecef;">
                    <div style="color: #666; font-size: 0.9em;">סה"כ מילים</div>
                    <div id="result-words" style="font-size: 2em; font-weight: 700; color: #667eea; margin: 8px 0;">0</div>
                </div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #e9ecef;">
                    <div style="color: #666; font-size: 0.9em;">זמן</div>
                    <div id="result-time" style="font-size: 2em; font-weight: 700; color: #667eea; margin: 8px 0;">0:00</div>
                </div>
                <div style="background: #f8f9fa; padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #e9ecef;">
                    <div style="color: #666; font-size: 0.9em;">קשר עין</div>
                    <div id="result-rating" style="font-size: 1.5em; font-weight: 700; color: #667eea; margin: 8px 0;">-</div>
                </div>
            </div>

            <div style="background: #f8f9fa; border-radius: 15px; padding: 20px; margin: 20px 0; border: 2px solid #e9ecef;">
                <div style="font-weight: bold; color: #667eea; margin-bottom: 10px;">💬 סיכום:</div>
                <div id="summary-text" style="color: #555; line-height: 1.6;"></div>
            </div>

            <div style="background: #f8f9fa; border-radius: 15px; padding: 20px; margin: 20px 0; border: 2px solid #e9ecef; max-height: 150px; overflow-y: auto;">
                <div style="font-weight: bold; color: #667eea; margin-bottom: 10px;">תמלול מלא:</div>
                <div id="result-transcript" style="color: #555;"></div>
            </div>

            <button class="btn btn-primary" onclick="goToCamera()">
                🔄 אימון נוסף
            </button>
            <button class="btn btn-secondary" onclick="goHome()">
                🏠 חזור לבית
            </button>
        </div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        let eyeCheckInterval = null;
        let recognition = null;
        let transcript = '';
        let wordCount = 0;
        let eyeScore = 100;
        
        function show(pageId) {
            // הסתר את כל הדפים
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // הצג את הדף הנבחר
            document.getElementById(pageId).classList.add('active');
        }
        
        function goHome() {
            console.log('[APP] Going home');
            
            // עצור הקלטה אם רצה
            if (startTime) {
                // עצור הכל
                if (timerInterval) clearInterval(timerInterval);
                if (eyeCheckInterval) clearInterval(eyeCheckInterval);
                if (recognition) recognition.stop();
                
                startTime = null;
                timerInterval = null;
                eyeCheckInterval = null;
                recognition = null;
                
                document.getElementById('eye-indicator').style.display = 'none';
            }
            
            show('home');
        }
        
        function goToCamera() {
            console.log('[APP] Going to camera');
            show('camera');
            
            // בקש גישה למצלמה
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, 
                audio: true 
            })
            .then(stream => {
                console.log('[CAMERA] Access granted');
                document.getElementById('video').srcObject = stream;
                window.currentStream = stream;
            })
            .catch(error => {
                console.error('[CAMERA] Error:', error);
                alert('לא ניתן לגשת למצלמה: ' + error.message);
            });
        }
        
        function goToHistory() {
            console.log('[APP] Going to history');
            loadHistory();
            show('history');
        }
        
        function saveToHistory(score, wpm, words, time, eyeRating, summary) {
            let history = JSON.parse(localStorage.getItem('oncam-history') || '[]');
            
            const session = {
                id: Date.now(),
                date: new Date().toLocaleString('he-IL', {
                    day: '2-digit',
                    month: '2-digit', 
                    hour: '2-digit',
                    minute: '2-digit'
                }),
                score: score,
                wpm: wpm,
                words: words,
                time: time,
                eyeRating: eyeRating,
                summary: summary,
                transcript: transcript
            };
            
            history.unshift(session);  // הוסף בתחילה
            
            // שמור רק 5 אחרונים
            if (history.length > 5) {
                history = history.slice(0, 5);
            }
            
            localStorage.setItem('oncam-history', JSON.stringify(history));
            console.log('[HISTORY] ✅ Saved session, total:', history.length);
        }
        
        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('oncam-history') || '[]');
            const list = document.getElementById('history-list');
            
            if (history.length === 0) {
                list.innerHTML = '<div style="text-align: center; padding: 50px; color: #999;"><div style="font-size: 3em; margin-bottom: 20px;">📭</div><div style="font-size: 1.2em; margin-bottom: 10px;">אין אימונים שמורים</div><div style="font-size: 0.9em;">הרץ אימון ראשון כדי להתחיל!</div></div>';
                return;
            }
            
            list.innerHTML = history.map(session => `
                <div style="background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 15px; padding: 20px; margin: 15px 0; position: relative; cursor: pointer; transition: all 0.3s ease;" onclick="viewHistorySession(${session.id})" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 5px 20px rgba(0,0,0,0.1)'" onmouseout="this.style.transform=''; this.style.boxShadow=''">
                    <div style="position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-size: 0.8em; cursor: pointer; display: flex; align-items: center; justify-content: center;" onclick="deleteHistorySession(${session.id}, event)">🗑️</div>
                    
                    <div style="text-align: right;">
                        <div style="font-weight: 700; color: #667eea; margin-bottom: 8px; font-size: 1.1em;">${session.date}</div>
                        <div style="color: #666; font-size: 0.9em; margin-bottom: 5px;">${session.wpm} WPM · ${session.words} מילים · ${Math.floor(session.time/60)}:${String(session.time%60).padStart(2,'0')}</div>
                        <div style="color: #666; font-size: 0.9em;">קשר עין: ${session.eyeRating}</div>
                    </div>
                    
                    <div style="position: absolute; top: 50%; left: 20px; transform: translateY(-50%); background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 10px 15px; border-radius: 50%; font-weight: 700; font-size: 1.2em;">${session.score}</div>
                </div>
            `).join('');
            
            console.log('[HISTORY] ✅ Loaded', history.length, 'sessions');
        }
        
        function deleteHistorySession(id, event) {
            event.stopPropagation();  // מנע מהלחיצה על הכרטיס
            
            if (!confirm('למחוק אימון זה?')) return;
            
            let history = JSON.parse(localStorage.getItem('oncam-history') || '[]');
            history = history.filter(s => s.id !== id);
            localStorage.setItem('oncam-history', JSON.stringify(history));
            
            console.log('[HISTORY] 🗑️ Deleted session', id);
            loadHistory();
        }
        
        function viewHistorySession(id) {
            const history = JSON.parse(localStorage.getItem('oncam-history') || '[]');
            const session = history.find(s => s.id === id);
            
            if (!session) return;
            
            console.log('[HISTORY] 👁️ Viewing session', id);
            
            // הצג את התוצאות הישנות
            document.getElementById('final-score').textContent = session.score;
            document.getElementById('result-wpm').textContent = session.wpm;
            document.getElementById('result-words').textContent = session.words;
            document.getElementById('result-time').textContent = `${Math.floor(session.time/60)}:${String(session.time%60).padStart(2,'0')}`;
            document.getElementById('result-rating').textContent = session.eyeRating;
            document.getElementById('summary-text').textContent = session.summary;
            document.getElementById('result-transcript').textContent = session.transcript || 'אין תמלול';
            
            show('results');
        }
        
        function startRecording() {
            console.log('[RECORDING] Starting...');
            
            // איפוס נתונים
            transcript = '';
            wordCount = 0;
            eyeScore = 100;
            document.getElementById('transcript-text').textContent = 'מקליט...';
            document.getElementById('transcript-text').style.color = '#333';
            document.getElementById('word-count').textContent = '0 מילים';
            document.getElementById('eye-indicator').style.display = 'block';
            
            startTime = Date.now();
            
            // החלף כפתורים
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
            
            // התחל טיימר
            timerInterval = setInterval(updateTimer, 1000);
            
            // התחל בדיקת קשר עין
            eyeCheckInterval = setInterval(checkEyeContact, 3000);
            
            // התחל זיהוי דיבור
            startSpeechRecognition();
            
            console.log('[RECORDING] ✅ Started successfully');
        }
        
        function stopRecording() {
            console.log('[RECORDING] Stopping...');
            
            // עצור טיימר
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // עצור בדיקת קשר עין
            if (eyeCheckInterval) {
                clearInterval(eyeCheckInterval);
                eyeCheckInterval = null;
            }
            document.getElementById('eye-indicator').style.display = 'none';
            
            // עצור זיהוי דיבור
            if (recognition) {
                recognition.stop();
                recognition = null;
            }
            
            const elapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
            const mins = elapsed / 60;
            const wpm = mins > 0 ? Math.round(wordCount / mins) : 0;
            
            startTime = null;
            
            // החלף כפתורים
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';
            
            // חישוב ציון
            const score = calculateScore(wpm, wordCount, elapsed, eyeScore);
            const rating = getSimpleRating(score);
            const summary = generateSimpleSummary(wpm, wordCount, elapsed, eyeScore);
            const eyeRating = getEyeRating(eyeScore);
            
            // הצג תוצאות
            showResults(score, wpm, wordCount, elapsed, rating, summary, eyeRating);
            
            console.log('[RECORDING] ✅ Stopped - Duration:', elapsed, 'Words:', wordCount, 'WPM:', wpm);
        }
        
        function calculateScore(wpm, words, time, eyeScore) {
            let score = 0;
            
            // ציון לקצב (40 נקודות)
            if (wpm >= 120 && wpm <= 180) score += 40;
            else if (wpm >= 100 && wpm < 120) score += 32;
            else if (wpm >= 80 && wpm < 100) score += 24;
            else if (wpm >= 60 && wpm < 80) score += 16;
            else if (wpm > 0) score += 8;
            
            // ציון לכמות מילים (25 נקודות)
            if (words >= 100) score += 25;
            else if (words >= 50) score += 20;
            else if (words >= 25) score += 12;
            else if (words >= 10) score += 8;
            else if (words > 0) score += 4;
            
            // ציון לאורך זמן (15 נקודות)
            if (time >= 60) score += 15;
            else if (time >= 30) score += 12;
            else if (time >= 15) score += 8;
            else if (time >= 5) score += 4;
            
            // ציון לקשר עין (20 נקודות)
            const eyePoints = Math.round((eyeScore / 100) * 20);
            score += eyePoints;
            
            return Math.min(100, score);
        }
        
        function getSimpleRating(score) {
            if (score >= 90) return 'מצוין! ⭐⭐⭐';
            else if (score >= 75) return 'טוב מאוד! ⭐⭐';
            else if (score >= 60) return 'טוב! ⭐';
            else if (score >= 40) return 'בסדר 👌';
            else return 'צריך תרגול 💪';
        }
        
        function generateSimpleSummary(wpm, words, time, eyeScore) {
            const parts = [];
            
            if (wpm >= 120 && wpm <= 180) {
                parts.push('קצב דיבור מצוין');
            } else if (wpm > 180) {
                parts.push('דיברת מהר מדי - כדאי להאט');
            } else if (wpm < 100 && wpm > 0) {
                parts.push('קצב איטי - כדאי להאיץ מעט');
            }
            
            if (words >= 50) {
                parts.push('כמות מילים טובה');
            } else if (words < 20) {
                parts.push('נסה לדבר יותר בפעם הבאה');
            }
            
            if (time >= 60) {
                parts.push('אורך זמן מצוין');
            } else if (time < 30) {
                parts.push('אימון קצר - נסה זמן יותר ארוך');
            }
            
            if (eyeScore >= 80) {
                parts.push('תאורה וקשר עין טובים');
            } else if (eyeScore < 60) {
                parts.push('כדאי לשפר תאורה');
            }
            
            return parts.length > 0 ? parts.join(', ') + '.' : 'המשך להתאמן!';
        }
        
        function getEyeRating(eyeScore) {
            if (eyeScore >= 90) return 'מצוין ✨';
            else if (eyeScore >= 75) return 'טוב 👍';
            else if (eyeScore >= 60) return 'בסדר 👌';
            else return 'צריך שיפור 💡';
        }
        
        function showResults(score, wpm, words, time, rating, summary, eyeRating) {
            // שמירה בהיסטוריה
            saveToHistory(score, wpm, words, time, eyeRating, summary);
            
            // מלא את הנתונים
            document.getElementById('final-score').textContent = score;
            document.getElementById('result-wpm').textContent = wpm;
            document.getElementById('result-words').textContent = words;
            document.getElementById('result-time').textContent = `${Math.floor(time/60)}:${String(time%60).padStart(2,'0')}`;
            document.getElementById('result-rating').textContent = eyeRating;
            document.getElementById('summary-text').textContent = summary;
            document.getElementById('result-transcript').textContent = transcript || 'אין תמלול';
            
            // עבור לעמוד תוצאות
            show('results');
        }
        
        function updateTimer() {
            if (!startTime) return;
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            
            document.getElementById('timer').textContent = 
                `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        
        function checkEyeContact() {
            const video = document.getElementById('video');
            const indicator = document.getElementById('eye-indicator');
            
            if (!video.videoWidth) return;
            
            try {
                // צילום פריים קטן לבדיקת בהירות
                const canvas = document.createElement('canvas');
                canvas.width = 60;
                canvas.height = 45;
                const ctx = canvas.getContext('2d');
                
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imageData.data;
                
                // חישוב בהירות ממוצעת
                let totalBrightness = 0;
                for (let i = 0; i < data.length; i += 4) {
                    const brightness = (data[i] + data[i + 1] + data[i + 2]) / 3;
                    totalBrightness += brightness;
                }
                const avgBrightness = totalBrightness / (data.length / 4);
                
                // בדיקת איכות תאורה ומיקום
                if (avgBrightness < 60) {
                    // תאורה חלשה
                    eyeScore = Math.max(0, eyeScore - 5);
                    indicator.textContent = '💡 אור חלש';
                    indicator.style.background = 'rgba(255, 152, 0, 0.9)';
                } else if (avgBrightness < 80) {
                    // תאורה בינונית
                    indicator.textContent = '👁️ בסדר';
                    indicator.style.background = 'rgba(255, 193, 7, 0.9)';
                } else {
                    // תאורה טובה
                    eyeScore = Math.min(100, eyeScore + 1);
                    indicator.textContent = '✅ מצוין';
                    indicator.style.background = 'rgba(76, 175, 80, 0.9)';
                }
                
                console.log(`[EYE] Brightness: ${avgBrightness.toFixed(1)}, Score: ${eyeScore}`);
                
            } catch (error) {
                console.error('[EYE] Error:', error);
                indicator.textContent = '👁️ בדיקה';
                indicator.style.background = 'rgba(108, 117, 125, 0.9)';
            }
        }
        
        function startSpeechRecognition() {
            // בדוק תמיכה
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                console.error('[SPEECH] Not supported');
                document.getElementById('transcript-text').textContent = 'זיהוי דיבור לא נתמך בדפדפן זה';
                document.getElementById('transcript-text').style.color = '#e74c3c';
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'he-IL';  // עברית
            recognition.continuous = true;  // המשך הקלטה
            recognition.interimResults = true;  // תוצאות זמניות
            
            recognition.onstart = () => {
                console.log('[SPEECH] ✅ Started');
            };
            
            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';
                
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const result = event.results[i];
                    const text = result[0].transcript;
                    
                    if (result.isFinal) {
                        finalTranscript += text + ' ';
                    } else {
                        interimTranscript += text;
                    }
                }
                
                if (finalTranscript) {
                    transcript += finalTranscript;
                    wordCount = transcript.trim().split(/\s+/).filter(word => word.length > 0).length;
                    
                    document.getElementById('word-count').textContent = `${wordCount} מילים`;
                    console.log('[SPEECH] New words:', finalTranscript.trim(), '| Total:', wordCount);
                }
                
                // הצג תמלול (קבוע + זמני)
                const displayText = transcript + interimTranscript;
                document.getElementById('transcript-text').textContent = displayText || 'מקליט...';
            };
            
            recognition.onerror = (event) => {
                console.error('[SPEECH] Error:', event.error);
                if (event.error === 'not-allowed') {
                    document.getElementById('transcript-text').textContent = 'נדרשת הרשאה למיקרופון';
                    document.getElementById('transcript-text').style.color = '#e74c3c';
                }
            };
            
            recognition.onend = () => {
                console.log('[SPEECH] Ended, restarting...');
                if (startTime) {  // רק אם עדיין מקליטים
                    setTimeout(() => {
                        if (recognition) recognition.start();
                    }, 1000);
                }
            };
            
            try {
                recognition.start();
            } catch (error) {
                console.error('[SPEECH] Start error:', error);
            }
        }
        
        console.log('[APP] OnCam Coach v2.5 loaded');
    </script>
</body>
</html>
