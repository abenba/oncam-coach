<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Navigation</title>
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; }
        .page { display: none; padding: 40px; margin: 20px; border: 2px solid #ccc; border-radius: 10px; }
        .page.active { display: block; background: #f0f0f0; }
        button { padding: 15px 25px; margin: 10px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>🧪 בדיקת ניווט</h1>
    
    <!-- דף בית -->
    <div id="home-page" class="page active">
        <h2>🏠 דף בית</h2>
        <button onclick="testGoToCamera()">🎬 לך למצלמה</button>
        <button onclick="testGoToHistory()">📊 לך להיסטוריה</button>
    </div>
    
    <!-- דף מצלמה -->
    <div id="camera-page" class="page">
        <h2>📹 דף מצלמה</h2>
        <p>✅ הניווט למצלמה עובד!</p>
        <button onclick="testGoHome()">🏠 חזור לבית</button>
    </div>
    
    <!-- דף היסטוריה -->
    <div id="history-page" class="page">
        <h2>📊 דף היסטוריה</h2>
        <p>✅ הניווט להיסטוריה עובד!</p>
        <button onclick="testGoHome()">🏠 חזור לבית</button>
    </div>
    
    <script>
        console.log('🧪 Test Navigation loaded');
        
        function show(pageId) {
            console.log('📍 Switching to:', pageId);
            
            // הסתר כל הדפים
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => {
                page.classList.remove('active');
                console.log('📤 Hidden:', page.id);
            });
            
            // הצג דף חדש
            const target = document.getElementById(pageId);
            if (target) {
                target.classList.add('active');
                console.log('📥 Shown:', pageId);
            } else {
                console.error('❌ Page not found:', pageId);
            }
        }
        
        function testGoToCamera() {
            console.log('🎬 Going to camera...');
            show('camera-page');
        }
        
        function testGoToHistory() {
            console.log('📊 Going to history...');
            show('history-page');
        }
        
        function testGoHome() {
            console.log('🏠 Going home...');
            show('home-page');
        }
        
        // בדוק שהכל טעון
        window.onload = function() {
            console.log('✅ Page loaded successfully');
            const pages = document.querySelectorAll('.page');
            console.log('📄 Found pages:', pages.length);
            pages.forEach(p => console.log('📄 Page ID:', p.id));
        };
    </script>
</body>
</html>
