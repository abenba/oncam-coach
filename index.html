<!DOCTYPE html>
<html>
<head>
    <title>OnCam Coach - Test</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="font-family: Arial; padding: 20px; text-align: center;">
    
    <h1>🎤 OnCam Coach</h1>
    <p>בדיקה מהירה</p>
    
    <div id="home" style="display: block;">
        <button onclick="showCamera()" style="padding: 20px; font-size: 18px; margin: 10px; width: 100%;">
            🚀 התחל אימון חדש
        </button>
        <button onclick="showHistory()" style="padding: 20px; font-size: 18px; margin: 10px; width: 100%;">
            📊 היסטוריה
        </button>
    </div>
    
    <div id="camera" style="display: none;">
        <h2>📹 מצלמה</h2>
        <video id="video" width="100%" height="300" autoplay></video>
        <br><br>
        <button onclick="showHome()" style="padding: 15px; font-size: 16px;">
            🏠 חזור לבית
        </button>
    </div>
    
    <div id="history" style="display: none;">
        <h2>📊 היסטוריה</h2>
        <p>אין אימונים שמורים</p>
        <button onclick="showHome()" style="padding: 15px; font-size: 16px;">
            🏠 חזור לבית
        </button>
    </div>

    <script>
        function showHome() {
            document.getElementById('home').style.display = 'block';
            document.getElementById('camera').style.display = 'none';
            document.getElementById('history').style.display = 'none';
        }
        
        function showCamera() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('camera').style.display = 'block';
            document.getElementById('history').style.display = 'none';
            
            // בקש מצלמה
            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    document.getElementById('video').srcObject = stream;
                })
                .catch(err => {
                    alert('שגיאת מצלמה: ' + err.message);
                });
        }
        
        function showHistory() {
            document.getElementById('home').style.display = 'none';
            document.getElementById('camera').style.display = 'none';
            document.getElementById('history').style.display = 'block';
        }
    </script>
</body>
</html>
