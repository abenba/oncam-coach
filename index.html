<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnCam Coach</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { 
            width: 100%; 
            max-width: 500px; 
            background: white; 
            border-radius: 25px; 
            padding: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { 
            color: #667eea; 
            text-align: center; 
            margin-bottom: 15px; 
            font-size: 2em; 
        }
        .subtitle { 
            text-align: center; 
            margin-bottom: 35px; 
            line-height: 1.8;
            color: #555;
        }
        .btn { 
            width: 100%; 
            padding: 18px; 
            margin: 12px 0; 
            border: none; 
            border-radius: 15px; 
            font-size: 1.1em; 
            font-weight: 600; 
            cursor: pointer; 
            font-family: inherit;
        }
        .btn-primary { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
        }
        .btn-secondary { 
            background: #f0f0f0; 
            color: #333; 
        }
        .page { display: none; }
        .page.active { display: block; }
        #video { 
            width: 100%; 
            height: 300px; 
            background: #000; 
            border-radius: 15px; 
            margin: 20px 0;
        }
        .version { 
            text-align: center; 
            color: #999; 
            font-size: 0.8em; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- עמוד בית -->
        <div id="home" class="page active">
            <h1>🎤 OnCam Coach</h1>
            <div class="subtitle">
                <div>יש לך בקרוב ראיון, אודיש'ן, הרצאה, פיץ' ?</div>
                <div>אני כאן בשבילך.</div>
            </div>
            <p class="version">גרסה 2.4 • פשוט ויעיל</p>
            
            <button class="btn btn-primary" onclick="goToCamera()">
                🚀 התחל אימון חדש
            </button>
            <button class="btn btn-secondary" onclick="goToHistory()">
                📊 היסטוריית אימונים
            </button>
        </div>

        <!-- עמוד מצלמה -->
        <div id="camera" class="page">
            <h1>🎬 הקלטה</h1>
            
            <div style="position: relative;">
                <video id="video" autoplay muted></video>
                <div id="timer" style="position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.8); color: white; padding: 10px 15px; border-radius: 10px; font-size: 1.2em; font-weight: bold;">00:00</div>
            </div>
            
            <button id="start-btn" class="btn btn-primary" onclick="startRecording()">
                ⏺️ התחל הקלטה
            </button>
            <button id="stop-btn" class="btn btn-secondary" onclick="stopRecording()" style="display: none;">
                ⏹️ עצור הקלטה
            </button>
            <button class="btn btn-secondary" onclick="goHome()">
                🏠 חזור לבית
            </button>
        </div>

        <!-- עמוד היסטוריה -->
        <div id="history" class="page">
            <h1>📊 היסטוריה</h1>
            <p style="text-align: center; padding: 50px; color: #999;">
                אין אימונים שמורים
            </p>
            <button class="btn btn-secondary" onclick="goHome()">
                🏠 חזור לבית
            </button>
        </div>
    </div>

    <script>
        let startTime = null;
        let timerInterval = null;
        
        function show(pageId) {
            // הסתר את כל הדפים
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            
            // הצג את הדף הנבחר
            document.getElementById(pageId).classList.add('active');
        }
        
        function goHome() {
            console.log('[APP] Going home');
            
            // עצור הקלטה אם רצה
            if (startTime) {
                stopRecording();
            }
            
            show('home');
        }
        
        function goToCamera() {
            console.log('[APP] Going to camera');
            show('camera');
            
            // בקש גישה למצלמה
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user' }, 
                audio: true 
            })
            .then(stream => {
                console.log('[CAMERA] Access granted');
                document.getElementById('video').srcObject = stream;
                window.currentStream = stream;
            })
            .catch(error => {
                console.error('[CAMERA] Error:', error);
                alert('לא ניתן לגשת למצלמה: ' + error.message);
            });
        }
        
        function goToHistory() {
            console.log('[APP] Going to history');
            show('history');
        }
        
        function startRecording() {
            console.log('[RECORDING] Starting...');
            
            startTime = Date.now();
            
            // החלף כפתורים
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
            
            // התחל טיימר
            timerInterval = setInterval(updateTimer, 1000);
            
            // הודעה לצ'ק
            console.log('[RECORDING] ✅ Started successfully');
        }
        
        function stopRecording() {
            console.log('[RECORDING] Stopping...');
            
            // עצור טיימר
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            const elapsed = startTime ? Math.floor((Date.now() - startTime) / 1000) : 0;
            startTime = null;
            
            // החלף כפתורים
            document.getElementById('start-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';
            
            // הצג תוצאה פשוטה
            alert(`הקלטה הסתיימה! אורך: ${Math.floor(elapsed/60)}:${String(elapsed%60).padStart(2,'0')}`);
            
            console.log('[RECORDING] ✅ Stopped, duration:', elapsed, 'seconds');
        }
        
        function updateTimer() {
            if (!startTime) return;
            
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = Math.floor(elapsed / 60);
            const secs = elapsed % 60;
            
            document.getElementById('timer').textContent = 
                `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
        }
        
        console.log('[APP] OnCam Coach v2.4 loaded');
    </script>
</body>
</html>
